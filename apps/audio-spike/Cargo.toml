[package]
name = "audio-spike"
version = "1.0.0"
edition = "2021"
description = "Diagnostic CLI tool for testing audio capture, synchronization, and spooling"

[[bin]]
name = "nebula-audio-spike"
path = "src/main.rs"

[dependencies]
audio-capture = { path = "../../crates/audio-capture" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
cpal = "0.15"
serde_json = "1.0"
